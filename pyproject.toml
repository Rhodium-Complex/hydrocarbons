[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "hydrocarbon-rust"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
benchmark = ["psutil>=5.9"]
pdf = [
    "rdkit>=2023.9",
    "reportlab>=4",
]

[tool.maturin]
module-name = "hydrocarbon_rust"
